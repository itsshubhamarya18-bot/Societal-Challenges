<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Societal Problem Analyzer</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            padding: 0;

            font-family: Arial, Helvetica, sans-serif;

            background: #f4f7fb;

            color: #1f2937;

            min-height: 100vh;
        }


        /* =====================================================
           MAIN CONTAINER
        ===================================================== */

        .container {

            width: 100%;

            max-width: 980px;

            margin: 0 auto;

            padding: 70px 30px 60px;
        }


        /* =====================================================
           MAIN CARD
        ===================================================== */

        .main-card {

            background: white;

            border-radius: 18px;

            padding: 52px 54px 48px;

            box-shadow:
                0 10px 35px rgba(30, 60, 90, 0.10);

            border: 1px solid #e3e8ef;
        }


        /* =====================================================
           ICON
        ===================================================== */

        .icon-box {

            width: 78px;

            height: 78px;

            margin: 0 auto 22px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #eef5ff;

            border-radius: 18px;

            font-size: 40px;
        }


        /* =====================================================
           TITLE
        ===================================================== */

        h1 {

            text-align: center;

            margin: 0;

            font-size: 38px;

            font-weight: 700;

            color: #111827;

            letter-spacing: -0.5px;
        }


        /* =====================================================
           DESCRIPTION
        ===================================================== */

        .description {

            max-width: 720px;

            margin: 16px auto 42px;

            text-align: center;

            font-size: 17px;

            line-height: 1.65;

            color: #58708d;
        }


        /* =====================================================
           FORM
        ===================================================== */

        .form-group {

            width: 100%;
        }


        .form-label {

            display: block;

            margin-bottom: 11px;

            font-size: 17px;

            font-weight: 600;

            color: #26384d;
        }


        textarea {

            width: 100%;

            min-height: 225px;

            resize: vertical;

            padding: 20px;

            border: 1px solid #cbd5e1;

            border-radius: 12px;

            font-family: Arial, Helvetica, sans-serif;

            font-size: 17px;

            line-height: 1.55;

            color: #374151;

            background: white;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }


        textarea::placeholder {

            color: #8da1ba;
        }


        textarea:focus {

            border-color: #3b82f6;

            box-shadow:
                0 0 0 3px rgba(59, 130, 246, 0.12);
        }


        /* =====================================================
           BUTTON
        ===================================================== */

        .button-container {

            display: flex;

            justify-content: center;

            margin-top: 26px;
        }


        button {

            border: none;

            background: #2864e8;

            color: white;

            padding: 15px 38px;

            border-radius: 10px;

            font-size: 17px;

            font-weight: 600;

            cursor: pointer;

            min-width: 245px;

            transition:
                background 0.2s ease,
                transform 0.1s ease,
                box-shadow 0.2s ease;
        }


        button:hover {

            background: #1f56d0;

            box-shadow:
                0 5px 15px rgba(40, 100, 232, 0.22);
        }


        button:active {

            transform: translateY(1px);
        }


        /* =====================================================
           ERROR MESSAGE
        ===================================================== */

        .error {

            margin-top: 18px;

            padding: 12px 15px;

            background: #fee2e2;

            color: #991b1b;

            border: 1px solid #fecaca;

            border-radius: 8px;

            font-size: 14px;

            text-align: center;
        }


        /* =====================================================
           RESPONSIVE DESIGN
        ===================================================== */

        @media (max-width: 800px) {

            .container {

                padding:
                    45px 20px 40px;
            }


            .main-card {

                padding:
                    40px 35px;
            }


            h1 {

                font-size: 32px;
            }


            .description {

                font-size: 16px;

                margin-bottom: 35px;
            }

        }


        @media (max-width: 500px) {

            .container {

                padding:
                    25px 14px 30px;
            }


            .main-card {

                padding:
                    30px 20px;

                border-radius: 14px;
            }


            .icon-box {

                width: 65px;

                height: 65px;

                font-size: 32px;

                border-radius: 15px;
            }


            h1 {

                font-size: 27px;
            }


            .description {

                font-size: 14px;

                line-height: 1.5;

                margin-top: 13px;

                margin-bottom: 30px;
            }


            .form-label {

                font-size: 15px;
            }


            textarea {

                min-height: 190px;

                font-size: 15px;

                padding: 15px;
            }


            button {

                width: 100%;

                min-width: 0;

                font-size: 15px;

                padding: 14px 20px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         MAIN PAGE
    ===================================================== -->

    <div class="container">


        <div class="main-card">


            <!-- =================================================
                 ICON
            ================================================= -->

            <div class="icon-box">

                🔍

            </div>


            <!-- =================================================
                 TITLE
            ================================================= -->

            <h1>

                Analyze a Societal Problem

            </h1>


            <!-- =================================================
                 DESCRIPTION
            ================================================= -->

            <p class="description">

                Describe a societal issue in your own words.
                The system will analyze the problem and classify
                it into the appropriate domain, sub-domain, and
                problem type.

            </p>


            <!-- =================================================
                 FORM
            ================================================= -->

            <form
                action="/predict"
                method="POST"
            >


                <div class="form-group">


                    <label
                        for="problem_text"
                        class="form-label"
                    >

                        Problem Description

                    </label>


                    <textarea
                        id="problem_text"
                        name="problem_text"
                        placeholder="Example: Farmers in our village are unable to irrigate their crops because there is not enough water during the summer..."
                        required
                    >{{ problem_text if problem_text else '' }}</textarea>


                </div>


                <!-- =================================================
                     SUBMIT BUTTON
                ================================================= -->

                <div class="button-container">

                    <button type="submit">

                        Analyze Problem →

                    </button>

                </div>


            </form>


            <!-- =================================================
                 ERROR
            ================================================= -->

            {% if error %}

                <div class="error">

                    {{ error }}

                </div>

            {% endif %}


        </div>


    </div>


</body>

</html>
